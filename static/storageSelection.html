<!DOCTYPE html>
<html lang="en">
	<head>
	<title>Storage Selection</title>
	<link rel="stylesheet" type="text/css" href="/static/styles/genericStyles.css">
	<link rel="stylesheet" type="text/css" href="/static/styles/storageSelectionStyles.css">
	</head>

	<body>
		<div class="Container">
			<h1>Storage Selection</h1>
			<div class="Folders">
				{{range .}}
				<form method="POST" action="/Cloud" style="display:inline">
					<input type="hidden" name="folder" value="{{.}}">
					<button formAction="/Cloud/Browse?folder={{.}}" class="FolderButton">
						{{.}}
					</button>
				</form>
				{{end}}
			</div>
		</div>
	</body>
</html>
